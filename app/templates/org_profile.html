{% extends 'base.html' %}

{% block content %}
<div class="form-container">

    {% if edit %}
    <h2> Edit organisation profile</h2>
    <form method="POST" action="{{ url_for('organisations.edit_profile') }}">
        <div class="form-group">
            <label> Organisation name</label>
            <input type="text" name="org_name" value="{{ org.org_name }}" required/>
        </div>
        <div class="form-group">
            <label> Organisation type</label>
            <input type="text" name="org_type" value="{{ org.org_type }}" required/>
        </div>
        <div class="form-group">
            <label> Location </label>
            <input type="text" name="location" value="{{ org.location }}" required/>
        </div>
        <div class="btn-row">
            <a href="{{ url_for('organisations.profile') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"> Save changes </button>
        </div>
    </form>

    {% else %}
    <h2> Organisation profile</h2>
    <div class="profile-details">
        <div class="profile-row">
            <span class="profile-label">Name</span>
            <span class="profile-value">{{ org.org_name }}</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Type</span>
            <span class="profile_value">{{ org.org_type }}</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Location</span>
            <span class="profile-value">{{ org.location }}</span>
        </div>
    </div>
    <div class="btn-row">
        <a href="{{ url_for('organisations.dashboard') }}" class="btn btn-secondary">Back</a>
        <a href="{{ url_for('organisations.edit_profile') }}" class="btn btn-primary"> Edit profile</a>
    </div>
    {% endif %}
</div>
{% endblock %}
