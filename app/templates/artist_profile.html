{% extends 'base.html' %}

{% block content %}
<div class="form-container">

    {% if edit %}
    <h2> Edit your profile</h2>
    <form method="POST" action="{{ url_for('artists.edit_profile') }}">
        <div class="form-group">
            <label> Full name</label>
            <input type="text" name="name" value="{{ artist.name}}" required/>
        </div>
        <div class="form-group">
            <label> Age</label>
            <input type="number" name="age" value="{{ artist.age}}" required/>
        </div>
        <div class="form-group">
            <label> Location</label>
            <input type="text" name="location" value="{{ artist.location}}" required/>
        </div>
        <div class="form-group">
            <label> Art form</label>
            <input type="text" name="art_form" value="{{ artist.art_form}}" required/>
        </div>
        <div class="form-group">
            <a href="{{ url_for('artists.profile') }}" class="btn btn-secondary"> Cancel</a>
            <button type="submit" class="btn btn-primary"> Save Changes</button>
        </div>
    </form>

    {% else %}
    <h2> My Profile</h2>
    <div class="profile-details">
        <div class="profile-row">
            <span class="profile-label"> Name</span>
            <span class="profile-value"> {{ artist.name }}</span>
        </div>
        <div class="profile-row">
            <span class="profile-label"> Age</span>
            <span class="profile-value"> {{ artist.age }}</span>
        </div>
        <div class="profile-row">
            <span class="profile-label"> Location</span>
            <span class="profile-value"> {{ artist.location }} </span>
        </div>
        <div class="profile-row">
            <span class="profile-label"> Art form</span>
            <span class="profile-value"> {{ artist.art_form }}</span>
        </div>
    </div>
    <div class="btn-row">
        <a href="{{ url_for('artists.dashboard') }}" class="btn btn-secondary"> Back</a>
        <a href="{{ url_for('artists.edit_profile') }}" class="btn btn-primary"> Edit Profile</a>
    </div>
    {% endif %}

</div>
{% endblock %}
